# Local infra cho cooking-recipe-service.
# Postgres giữ schema + recipes; Redis là backing store của Asynq queue.
# Mặc định khớp với DATABASE_URL/REDIS_ADDR trong .env.example.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cooking-recipe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cooking_recipe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cooking_recipe"]
      interval: 5s
      timeout: 5s
      retries: 10

